name: "Bundle Audit"

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  audit-gem-security-notices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
          bundler-cache: true
      - name: Update Security audit definitions
        run: bin/rails bundle:audit:update
      - name: Security audit dependencies
        run: bin/rails bundle:audit
